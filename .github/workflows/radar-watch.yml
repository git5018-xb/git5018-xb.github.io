name: 西安体育岗雷达盯梢
on:
  schedule:
    # 北京时间 8:15–20:15，每 2 小时
    - cron: "15 0,2,4,6,8,10,12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 扫描官方招考页
        run: node radar-scan.mjs
      - name: 写回盯梢结果
        run: |
          git config user.name "xian-pe-radar-bot"
          git config user.email "radar@users.noreply.github.com"
          git add radar-updates.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "自动盯梢：更新官方招聘标题 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
