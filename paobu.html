};

 {t:'站立式起跑与诊断跑',type:'新授课',obj:['掌握站立式起跑和起跑后加速的基本动作。','能依据呼吸和动作质量调节速度。','遵守分道规则，认真记录同伴表现。'],key:'听信号快速启动，起跑后逐渐抬高重心。',diff:'避免起跑过猛，在完整跑中保持放松。',c:['站立式起跑姿势练习。','站立式起跑3×30米，起跑接加速跑3×60米。','分组完成400米诊断跑1次，不进行名次比较。','记录时间、后100米动作变化和RPE。'],tch:['正侧面示范前后脚位置、身体前倾和积极摆臂。','按能力分组发令，记录时间并观察呼吸和动作。','强调跑过终点后继续减速。'],stu:['听信号依次起跑，保持本跑道。','诊断跑中不盲目跟跑。','未跑学生担任计时员和观察员。'],org:'每组6—10人；终点设置20米减速区，返回走跑道外侧。',dose:'30米×3；60米×3；400米×1',load:'中等至中高强度，RPE 6—7。'},
 {t:'弯道跑技术',type:'新授课',obj:['能做出整体内倾、外侧臂摆幅略大、沿分道跑进。','掌握弯道跑前踝、膝热身方法。','在同伴评价中合作改进。'],key:'身体从脚踝起向圆心适度内倾。',diff:'根据速度调整内倾，使摆臂、蹬地和姿态协调。',c:['讲解弯道跑原理，进行正误对比。','原地弯道摆臂20次×2组，小圆圈跑2圈×2组。','弧线跑30米×2组，弯道100米×3组。','围绕整体内倾、摆臂协调、不越分道互评。'],tch:['多角度示范并用标志桶划分练习区。','按示范—练习—反馈—再练习组织。','纠正折腰、横摆臂和越线。'],stu:['复述三个动作要点并按组练习。','保持8—10米间距。','给同伴提出一条具体建议。'],org:'每道单向练习；练习区与观察区分开；跑后直道减速。',dose:'摆臂20次×2；30米×2；100米×3',load:'中等强度，RPE 5—7。'},
 {t:'分段配速与途中跑',type:'复习巩固课',obj:['理解前程控制、途中稳定、末段坚持。','能利用呼吸和RPE判断速度。','按组完成计时记录。'],key:'前100米不过度冲刺，途中保持步频和放松摆臂。',diff:'疲劳后保持躯干稳定和呼吸节奏。',c:['讲解400米体力分配。','2组“200米＋200米”分段跑，组内间歇60—90秒。','4×50米节奏接力。','比较各段时间，判断是否前快后慢。'],tch:['给不同能力组节奏提示，不规定统一秒数。','在200米点计时并反馈。','动作质量明显下降时降低强度。'],stu:['主动控制第一段速度。','利用RPE和呼吸评价用力程度。','小组合作分析前后段差异。'],org:'按能力分3—4组；计时员站跑道外侧。',dose:'200米＋200米×2组；50米×4',load:'中高强度，RPE 6—7。'},

 {t:'单元展示与评价',type:'考核课',obj:['完整运用400米技术。','独立完成热身和跑后恢复。','客观记录并尊重个体进步。'],key:'执行个人配速计划，完整运用技术。',diff:'最后100米保持动作和意志品质。',c:['复习起跑、弯道和终点减速。','按能力分组完成400米测试1次。','未测试学生负责计时和观察。','完成技术、配速、进步和合作四维评价。'],tch:['再次确认健康状况和跑道安全。','按能力分组发令并记录。','以个人进步和技术运用为主评价。'],stu:['独立热身并按计划测试。','终点后继续慢走。','认真履行计时观察任务。'],org:'每组6—10人；测试、等待、恢复三区分开。',dose:'400米×1',load:'高强度单次测试，RPE 8—9；之后只恢复。'}]},

 {t:'呼吸节奏与耐力诊断',type:'新授课',obj:['掌握放松跑与基本呼吸节奏。','能用谈话测试和RPE判断强度。','按自身水平完成任务。'],key:'动作放松、步频自然，口鼻配合呼吸。',diff:'找到能够持续的个人速度。',c:['讲解口鼻配合和两步一吸、两步一呼。','连续慢跑4—5分钟，以能说短句为宜。','3×200米匀速跑，间歇慢走90秒。','记录RPE、呼吸和动作感受。'],tch:['示范放松跑和呼吸方法。','观察面色、呼吸和动作，指导分层。','不进行公开名次比较。'],stu:['尝试呼吸节奏。','按能力完成练习。','如实记录RPE和感受。'],org:'按能力分组，前后8—10米，超越从外侧。',dose:'连续跑4—5分钟；200米×3',load:'中等强度，RPE 5—6。'},
 {t:'站立式起跑与安全超越',type:'新授课',obj:['掌握起跑、跟随跑和外侧超越。','识别拥挤和突然变道风险。','不推挤、不阻挡。'],key:'起跑后建立节奏，超越前观察并从外侧完成。',diff:'多人跑进时保持位置感和安全距离。',c:['讲解起跑、跟随和超越规则。','小组起跑4×60米。','3×300米匀速跑，间歇2分钟。','指定区域练习安全超越。'],tch:['设置超越区并示范完整流程。','控制每组人数。','及时制止突然变道和推挤。'],stu:['按信号起跑并进入节奏。','超越前观察，不封堵路线。','组间慢走恢复。'],org:'每组6—8人；设置超越区、减速区和返回通道。',dose:'60米×4；300米×3',load:'中等强度，RPE 5—6。'},
 {t:'均匀配速',type:'复习巩固课',obj:['实践均匀配速。','根据时间、呼吸和RPE调整速度。','认真计时并尊重差异。'],key:'前程控制，中段维持，分段时间相对稳定。',diff:'避免跟跑导致速度失控。',c:['讲解800米分段策略。','2×400米配速跑，间歇3—4分钟。','4×50米放松加速跑。','比较两次400米时间和RPE。'],tch:['提供三种能力节奏提示。','记录分段并反馈。','恢复不足者减少重复。'],stu:['按个人计划完成。','组间慢走、补水。','用数据和感受调整节奏。'],org:'分组错时出发；计时员固定站位。',dose:'400米×2；50米×4',load:'中等至中高强度，RPE 6—7。'},

const safety=['课前询问伤病、哮喘、心血管问题和当日身体状态；不适者降级、见习或按规定免测。','练习区、等待区、观察区和返回路线分开；不得突然变道、推挤或横穿跑道。','出现胸痛、眩晕、异常呼吸、面色苍白或动作失控时立即停止并按学校应急程序处理。','测试后继续慢走和放松；高温、空气质量不佳或场地湿滑时调整内容。'];
let eventKey=location.hash==='#800'?'800':'400',selected=0;
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function hero(P,title,sub,badge){return `<header class="hero"><div><small>PHYSICAL EDUCATION</small><h2>${esc(title)}</h2><p>${esc(sub)}</p></div><div class="badge"><b>${badge}</b><span>${badge==='6'?'课时':'分钟'}</span></div></header>`}
function unitHtml(P){return hero(P,P.title,'每周3课时 · 每课45分钟 · 共6课时','6')+`<div class="body"><span class="eyebrow">UNIT GOALS</span><h3>单元学习目标</h3><ol class="goals">${P.goals.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="keygrid"><div><b>教学重点</b><p>${esc(P.key)}</p></div><div><b>教学难点</b><p>${esc(P.diff)}</p></div></div><span class="eyebrow">SCHEDULE</span><h3>课时进度</h3><div class="schedule">${P.lessons.map((x,i)=>`<div class="srow"><em>${String(i+1).padStart(2,'0')}</em><span>第${Math.floor(i/3)+1}周 · 第${i%3+1}节</span><b>${esc(x.t)}</b></div>`).join('')}</div><div class="evalgrid"><div><b>评价建议</b><ul><li>运动技术30%</li><li>配速或节奏25%</li><li>完成表现与个人进步25%</li><li>态度、安全与合作20%</li></ul></div><div class="safe"><b>安全要求</b><ul>${safety.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div><p class="source">课程目标依据《义务教育体育与健康课程标准（2022年版）》的运动能力、健康行为和体育品德三个方面组织；使用前须结合本班学情、天气和场地复核。</p></div>`}
function lines(a){return a.map((x,i)=>`<p>${i+1}. ${esc(x)}</p>`).join('')}
function lessonHtml(P,L,i,standalone=false){const stages=[COMMON.start,COMMON.prep,{name:'基本部分',min:25,c:L.c,t:L.tch,s:L.stu,o:L.org+' 次数：'+L.dose},COMMON.end];return `<section class="${standalone?'lesson-page paper':''}">${hero(P,`${i+1}. ${L.t}`,`第${Math.floor(i/3)+1}周 · 第${i%3+1}节 · 45分钟 · ${L.type}`,'45')}<div class="body"><table class="meta"><tr><th>学科</th><td>体育与健康</td><th>年级</th><td>七年级</td><th>课型</th><td>${esc(L.type)}</td></tr><tr><th>课题</th><td colspan="5">${esc((eventKey==='400'?'400米跑——':'800米跑——')+L.t)}</td></tr></table><div class="objectives"><b>学习目标</b><ol>${L.obj.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div><div class="keygrid"><div><b>教学重点</b><p>${esc(L.key)}</p></div><div><b>教学难点</b><p>${esc(L.diff)}</p></div></div><div class="tablewrap"><table class="lesson"><thead><tr><th>过程</th><th>时间</th><th>教学内容</th><th>教师活动</th><th>学生活动</th><th>组织及要求</th></tr></thead><tbody>${stages.map(x=>`<tr><th>${x.name}</th><td>${x.min}′</td><td>${lines(x.c)}</td><td>${lines(x.t)}</td><td>${lines(x.s)}</td><td>${esc(x.o)}</td></tr>`).join('')}</tbody></table></div><div class="footgrid"><div><b>预计负荷</b><p>${esc(L.load)}</p></div><div><b>场地器材</b><p>田径场、标志桶8—12个、口哨1个、秒表1—2块、记录表。</p></div><div><b>安全提示</b><p>${esc(safety.join(' '))}</p></div><div><b>教学反思</b><p>课后根据目标达成、练习密度、安全组织及学生个体差异进行记录。</p></div></div></div></section>`}
function render(){const P=PLANS[eventKey];document.querySelectorAll('.switch button').forEach(b=>b.classList.toggle('on',b.dataset.event===eventKey));$('#lessonNav').innerHTML=`<button data-i="0">单元总览</button>`+P.lessons.map((x,i)=>`<button data-i="${i+1}">${i+1}. ${esc(x.t)}</button>`).join('');document.querySelectorAll('#lessonNav button').forEach(b=>b.classList.toggle('on',+b.dataset.i===selected));$('#screen').innerHTML=selected===0?unitHtml(P):lessonHtml(P,P.lessons[selected-1],selected-1);location.hash=eventKey;}
document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>{eventKey=b.dataset.event;selected=0;render()});$('#lessonNav').onclick=e=>{const b=e.target.closest('button');if(!b)return;selected=+b.dataset.i;render();scrollTo({top:0,behavior:'smooth'})};
$('#printOne').onclick=()=>print();$('#printAll').onclick=()=>{const P=PLANS[eventKey];$('#printAllDoc').innerHTML=`<section class="lesson-page paper">${unitHtml(P)}</section>`+P.lessons.map((L,i)=>lessonHtml(P,L,i,true)).join('');document.body.classList.add('print-all');setTimeout(()=>print(),60)};onafterprint=()=>document.body.classList.remove('print-all');
function exportWord(){const P=PLANS[eventKey],body=`<h1 style="text-align:center">${esc(P.title)}</h1>${unitHtml(P)}${P.lessons.map((L,i)=>lessonHtml(P,L,i,true)).join('')}`,css=`body{font-family:'Microsoft YaHei',SimSun;font-size:10pt;line-height:1.5}table{width:100%;border-collapse:collapse;margin:8pt 0}th,td{border:1px solid #333;padding:4pt;vertical-align:top}th{background:#edf3ef}h1,h2{text-align:center}.hero{border:1px solid #333;padding:8pt}.badge{display:none}.body{padding:5pt}.lesson-page{page-break-after:always}.keygrid,.footgrid{display:table;width:100%}.keygrid>div,.footgrid>div{border:1px solid #999;padding:5pt;margin:3pt}p{margin:2pt 0}`;const html=`<html><head><meta charset="utf-8"><style>${css}</style></head><body>${body}</body></html>`,blob=new Blob(['\ufeff'+html],{type:'application/msword;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=P.title+'.doc';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)}
$('#wordAll').onclick=exportWord;render();
</script>
