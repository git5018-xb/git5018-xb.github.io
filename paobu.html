<body>
<header class="top noprint"><div class="topin"><div><a href="pe.html">← 返回体育教学工具箱</a><h1>七年级400米与800米跑详细教案</h1><p>与网站现有教案生成器同款表格 · 每周3节 · 两周6课时 · 每节45分钟</p></div><div class="actions"><button id="printOne">打印本节</button><button id="printAll">打印整套</button><button class="word" id="wordOne">导出本节Word</button><button class="word" id="wordAll">导出整套Word</button></div></div></header>
<main class="wrap">

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formation={
  gather:`○ ○ ○ ○ ○ ○ ○ ○\n○ ○ ○ ○ ○ ○ ○ ○\n○ ○ ○ ○ ○ ○ ○ ○\n○ ○ ○ ○ ○ ○ ○ ○\n        ▲`,
  warm:`○   ○   ○   ○   ○\n  ○   ○   ○   ○\n○   ○   ○   ○   ○\n        ▲`,
  lanes:`第1道  ○ → → → →\n第2道  ○ → → → →\n第3道  ○ → → → →\n第4道  ○ → → → →\n       ▲（跑道外侧）`,
  groups:`[1组] ○○○    [2组] ○○○\n[3组] ○○○    [4组] ○○○\n          ▲（巡回）`,
  circle:`    ○ ○ ○\n  ○       ○\n ○    ▲    ○\n  ○       ○\n    ○ ○ ○`
};
const baseSafety='课前询问伤病、心血管及呼吸系统病史和当日身体状态，身体不适者见习或降低负荷；练习区、等待区、观察区和返回路线分开，严禁横穿跑道、逆向跑和推挤；出现胸闷、眩晕、恶心、面色苍白或动作失控时立即停止练习并按学校应急预案处理；遇高温、雷雨、强风或跑道湿滑时改为室内理论、低强度练习或延期。';
function row(m,i,name,c,t,s,x,f,r,tag='学练一',color=''){return {m,i,name,c,t,s,x,f,r,tag,color};}
const PLANS={
  '400':[
    {name:'站立式起跑与诊断跑',type:'新授课',desc:'初步学习站立式起跑，建立400米完整跑的体力分配意识',key:'站立式起跑姿势和起跑后逐渐加速',diff:'避免起跑过猛，在疲劳状态下保持动作放松',goals:[
      '<b>运动能力：</b>通过学习，80%以上学生能说出并完成站立式起跑的主要动作，做到前后脚站立、身体前倾、听信号快速启动；能按个人能力完成1次400米诊断跑。',
      '<b>健康行为：</b>学会用呼吸、动作质量和RPE（主观用力程度）判断强度，完成跑前动态热身和跑后慢走恢复，不盲目追逐他人。',
      '<b>体育品德：</b>遵守分道、发令和终点减速规则，认真承担计时员、观察员角色，尊重同伴差异并如实记录。'],
      prep:['小步跑、高抬腿、后蹬跑各2×20米','渐进加速跑2×50米'],equipment:'标志桶12个、起点线、口哨1个、秒表2—4块、记录卡若干',safety:'起跑学生前方跑道确认无人；诊断跑按能力分组错时出发，终点后继续向前慢跑或慢走20米。',stat:{avg:132,max:168,dens:42,all:76,strength:'中等'},rows:[
        row(8,2,'站立式起跑动作学习',['前后脚开立，强脚在前','屈膝降重心，上体自然前倾','听“跑”声后后脚快速蹬地，双臂积极摆动'],`【导入与示范】对比站立式起跑与直立起跑，完整示范2次并分解脚位、重心和摆臂。<br><b>预设错误与纠正：</b><br>1. 同手同脚——先做原地前倾摆臂，再接起跑。<br>2. 重心后坐——提示“肩在前脚尖前方”。`,'观察正侧面示范；两人一组检查脚位和身体前倾；听口令轮换练习','4组×3次','四列横队分组，前后间隔3米',`口令未发不得抢跑；完成后从跑道外侧返回。<br><span class="formation">${formation.groups}</span>`,'学练一'),
        row(8,3,'起跑后加速衔接',['站立式起跑3×30米','起跑接渐进加速跑4×50米','同伴观察前10步重心变化'],`用标志盘设置10米、30米、50米点；强调起跑后不是立即直立，而是随速度逐渐抬高重心；分别反馈第一步方向、摆臂和加速节奏。`,'按能力分组听信号起跑；前10步积极但不僵硬；观察员用“脚位—前倾—摆臂”三项口令反馈','30米×3；50米×4','4人一组分道进行',`前组越过30米线后下一组再出发；返回走跑道外侧。<br><span class="formation">${formation.lanes}</span>`,'学练二','g'),
        row(9,4,'400米诊断跑',['填写“前100米控制—中段稳定—末段坚持”计划','按能力分组完成400米1次','记录完成时间、RPE及后100米动作表现'],`说明诊断目的不是排名，而是了解节奏；每组6—8人，发令前确认健康状态；在200米和终点报时，观察是否出现前快后慢、耸肩或步幅骤降。`,'按个人计划完成，不强行跟随更快同伴；未跑学生分任计时、分段观察和终点引导；跑后慢走并记录RPE','400米×1','按能力分3—4组错时出发',`终点设置20米减速区；计时员站跑道外侧，任何人不得突然横切。<br><span class="formation">${formation.lanes}</span>`,'学练三','g'),
        row(5,2,'补偿性体能与恢复',['提踵15次','前弓步交换10次/侧','平板支撑20—30秒','走动中深呼吸恢复'],`示范动作标准，按“下肢—核心—呼吸”三站组织；根据诊断跑恢复情况减量，动作变形立即停止。`,'按站位完成，互相计数；保持动作规范；能完整说话后再进入下一站','3站×1—2轮','分组分站循环',`不憋气、不比拼次数；组间慢走20秒。<br><span class="formation">${formation.groups}</span>`,'课课练（体能）','o')]
    },
    {name:'弯道跑技术',type:'新授课',desc:'学习身体内倾、两臂协调和沿切线进入直道的方法',key:'身体自然向内倾斜，外侧臂摆幅稍大',diff:'内倾来自全身整体，不是折腰；直弯道衔接自然',goals:[
      '<b>运动能力：</b>80%以上学生能在中速弯道跑中做到身体自然内倾、右臂摆幅稍大、脚掌着地稳定，并完成直道—弯道—直道衔接。',
      '<b>健康行为：</b>能根据弯道半径和速度调整内倾程度，理解速度越快内倾越明显，练习后主动放松踝、膝、髋关节。',
      '<b>体育品德：</b>坚持分道练习，不抢内道、不突然变线；观察同伴时使用具体、友善的技术语言。'],
      prep:['弧线慢跑2圈（变换半径）','内外侧摆臂徒手练习2×20秒','直道渐进跑2×60米'],equipment:'标志桶16个、标志盘20个、口哨1个、秒表2块',safety:'弯道练习固定方向和跑道，前后保持20米以上间隔；禁止从内场突然进入跑道。',stat:{avg:136,max:172,dens:45,all:78,strength:'中等偏上'},rows:[
        row(7,2,'弯道跑动作感知',['原地弯道摆臂2×20秒','沿小圆—大圆慢跑各2圈','两人一组观察身体内倾方向'],`画出身体纵轴，说明整体向圆心方向倾斜；示范右臂摆幅稍大、左臂贴近身体；用慢速弧线跑帮助学生先建立感觉。<br><b>易错：</b>只歪头或折腰；纠正为“耳—肩—髋保持一线”。`,'先徒手模仿，再沿不同半径圆弧慢跑；同伴从正面观察耳、肩、髋是否成一线','徒手2组；圆弧各2圈','4组分区练习',`各组圆弧区域不交叉；慢跑返回。<br><span class="formation">○ ○ ○　　　○ ○ ○\n  ○ ▲ ○　　　○ ▲ ○</span>`,'学练一'),
        row(10,3,'分道弯道跑',['弯道跑6×80米','前40米中速、后40米逐渐加速','观察左右臂摆幅和脚落点'],`在弯道入口、顶点和出口设标志；先中速示范再快速示范；逐组提示“看前方—内倾—外臂大—脚下稳”。`,'每次只关注一个技术点；完成后用“做到1项、改进1项”互评；逐次提高速度但保留动作质量','80米×6，间歇60—90秒','4—6人一组分道',`同一道前后间隔20米，前人出弯后后人再出发。<br><span class="formation">${formation.lanes}</span>`,'学练二','g'),
        row(8,4,'直弯道衔接跑',['直道30米＋弯道60米＋直道30米','保持进入弯道前的节奏','出弯后逐渐减小内倾并沿切线加速'],`示范“直道放松—入弯渐倾—出弯渐直”；在衔接点观察是否突然减速或横跨跑道；对技术稳定学生提高至85%速度。`,'按分道连续完成；出弯时不急于直立；观察员记录入弯、弯中、出弯三处表现','120米×3','按能力分组分道轮换',`跑完全程越过终点再减速；不得串道。<br><span class="formation">直道 →（弯道）→ 直道\n ○　　　　　     ○\n        ▲</span>`,'学练三','g'),
        row(5,3,'下肢稳定性课课练',['单脚提踵12次/侧','侧向小步移动15秒','弓步静止20秒/侧','原地小步频20秒'],`强调踝、膝、髋同向和躯干稳定；设置基础量与提高量，技术动作不稳者完成基础量。`,'按站循环；相互观察膝关节是否内扣；动作规范后再加快','4站×1轮','分站循环',`站间相距4米，移动方向统一；不在疲劳下追求次数。<br><span class="formation">${formation.groups}</span>`,'课课练（体能）','o')]
    },
    {name:'分段配速与途中跑',type:'复习巩固课',desc:'学习400米前程控制、中段稳定和末段坚持的分段节奏',key:'前100米积极但不过度冲刺，中段保持步频和放松摆臂',diff:'利用分段时间、呼吸和RPE及时调整速度',goals:[
      '<b>运动能力：</b>85%以上学生能依据个人诊断成绩制定分段计划，并在200米和“200米＋200米”练习中保持较稳定节奏。',
      '<b>健康行为：</b>能用分段时间、呼吸和RPE共同判断强度，理解“前快过多会导致后程明显降速”，学会组间主动恢复。',
      '<b>体育品德：</b>认真执行个人计划，不盲目攀比；计时与记录真实准确，小组共同分析并提出调整意见。'],

function startRow(){return {p:'开始部分',m:3,i:1,c:['体育委员集合整队，检查人数与服装','师生问好，宣布本课内容、目标和要求','安排见习生参与计时、记录或观察','询问身体状况，强调跑道与停止信号'],t:'教师提前检查跑道、终点缓冲区和器材；用哨音集合，要求“快、静、齐”；检查鞋带、服装及随身硬物；明确身体不适报告方式。',s:'体育委员整队报数；学生认真听讲，明确学习任务和安全规则；见习生领取岗位卡。',x:'1次',f:'四列横队',r:`集合迅速、精神饱满；学生间隔适当。<br><span class="formation">${formation.gather}</span>`};}
function prepRow(plan,eventKey){return {p:'准备部分',m:8,i:2,c:[eventKey==='400'?'绕田径场慢跑2圈，逐渐提高体温':'绕田径场慢跑2圈，保持可交谈速度','徒手操：头颈、肩、腰髋、膝、踝动态活动4×8拍'].concat(plan.prep),t:'教师领跑并控制节奏；镜面示范徒手操，提示动作幅度由小到大；巡回纠正跑的专门性练习，重点激活踝、膝、髋和肩带。',s:'跟随慢跑，保持队形；按节拍完成徒手操；专项练习动作到位，逐步提高速度并体会与本课重点的联系。',x:'徒手操4×8拍；专项练习按规定次数',f:'一路纵队慢跑→体操队形→分道练习',r:`充分活动各关节，不做剧烈弹振；前后保持安全距离。<br><span class="formation">${formation.warm}</span>`};}
function endRow(){return {p:'结束部分',m:4,i:1,c:['集合整队，慢走与深呼吸','静态拉伸：小腿、股四头肌、腘绳肌、髋部，每个动作15—20秒','课堂小结：回顾技术重点、负荷感受和规则表现','布置课后任务：低强度自主跑与本课技术复习','收还器材，师生再见'],t:'教师领做放松，语调舒缓；询问RPE和身体反应；结合具体表现评价进步与问题；说明课后只做适量巩固，不追加高强度。',s:'跟做慢走和拉伸，主动反馈身体感受；完成自评；协助清点器材并恢复场地。',x:'放松1遍',f:'成圆形或四列横队',r:`放松充分，不做弹振式拉伸；器材清点归位。<br><span class="formation">${formation.circle}</span>`};}
function rowsFor(plan,eventKey){const basic=plan.rows.map((r,i)=>({...r,p:i===0?'基本部分':''}));return [startRow(),prepRow(plan,eventKey),...basic,endRow()];}
function list(items){return `<ul class="pl">${items.map(x=>`<li>${x}</li>`).join('')}</ul>`;}
function renderPlan(plan,index,eventKey,all=false){
  const rows=rowsFor(plan,eventKey),basicCount=plan.rows.length;
  const teacher=esc($('#teacher').value||'　　　'),cls=esc($('#className').value||'七年级（1）班'),num=esc($('#studentNum').value||'40'),date=esc($('#lessonDate').value),venue=esc($('#venue').value||'标准田径场');
  let h=`<div class="pa-title" contenteditable="true">体育与健康课时教案</div><div class="pa-sub">水平四 · 七年级 · ${eventKey}米跑两周单元 · 第${index+1}课时</div>
  <table class="pa"><colgroup><col style="width:13%"><col style="width:20%"><col style="width:12%"><col style="width:17%"><col style="width:13%"><col></colgroup>
  <tr><th>授课教师</th><td contenteditable="true">${teacher}</td><th>班　级</th><td contenteditable="true">${cls}</td><th>人　数</th><td contenteditable="true">${num} 人</td></tr>
  <tr><th>授课日期</th><td contenteditable="true">${date}</td><th>课的类型</th><td contenteditable="true">${esc(plan.type)}</td><th>课　时</th><td contenteditable="true">第${index+1}课时 / 共6课时</td></tr>
  <tr><th>教材内容</th><td colspan="3" contenteditable="true"><b>田径·跑——${eventKey}米跑：${esc(plan.name)}</b>（${esc(plan.desc)}）</td><th>时　长</th><td contenteditable="true">45分钟</td></tr>
  <tr><th>学习目标</th><td colspan="5" contenteditable="true">${list(plan.goals)}</td></tr>
  <tr><th>重　点</th><td colspan="5" contenteditable="true">${esc(plan.key)}</td></tr>
  <tr><th>难　点</th><td colspan="5" contenteditable="true">${esc(plan.diff)}</td></tr>
  <tr><th>场地器材</th><td colspan="5" contenteditable="true">${esc(plan.equipment)}　｜　场地条件：${venue}</td></tr></table>
  <table class="pa" style="margin-top:10px"><colgroup><col style="width:38px"><col style="width:40px"><col style="width:23%"><col style="width:25%"><col style="width:18%"><col></colgroup>
  <tr><th>部分</th><th>时间</th><th>教学内容</th><th>教师活动（教法）</th><th>学生活动（学法）</th><th>组织与要求</th></tr>`;
  rows.forEach((r,ri)=>{
    const isBasic=ri>=2&&ri<2+basicCount;
    const content=isBasic?[`<span class="tag ${r.color}">${esc(r.tag)}</span><b>${esc(r.name)}</b>`].concat(r.c):r.c;
    const partCell=r.p?`<td class="part-cell" rowspan="${r.p==='基本部分'?basicCount:1}">${r.p}</td>`:'';
    h+=`<tr>${partCell}<td class="cen" contenteditable="true">${r.m}′</td><td contenteditable="true">${list(content)}</td><td contenteditable="true">${r.t}</td><td contenteditable="true">${r.s}</td><td contenteditable="true"><b>次数/组数：</b>${r.x}<br><b>队形：</b>${r.f}<br><b>要求：</b>${r.r}</td></tr>`;
  });
  h+=`</table><table class="pa" style="margin-top:10px"><colgroup><col style="width:13%"><col></colgroup>
  <tr><th>预计运动负荷</th><td><div class="loadbox"><div class="loadstat">平均心率约 <b>${plan.stat.avg}</b> 次/分<br>最高心率约 <b>${plan.stat.max}</b> 次/分<br>练习密度约 <b>${plan.stat.dens}%</b><br>综合密度约 <b>${plan.stat.all}%</b><br>运动强度：<b>${plan.stat.strength}</b><div class="loadnote">预计值仅供备课，课堂中按个体状态动态调整。</div></div>${loadSVG(rows)}</div></td></tr>
  <tr><th>安全提示</th><td contenteditable="true">${esc(plan.safety)} ${esc(baseSafety)}</td></tr>
  <tr><th>课后反思</th><td contenteditable="true" style="height:86px">（1）目标达成情况：<br>（2）学生配速、技术与负荷表现：<br>（3）组织教法的有效之处与需改进之处：<br>（4）个体差异与安全情况：<br>（5）下节课调整方向：</td></tr></table>`;
  return all?`<section class="one-plan">${h}</section>`:h;
}
function loadSVG(rows){
  const W=330,H=132,PL=34,PB=20,PT=8,tot=rows.reduce((a,b)=>a+b.m,0),x=t=>PL+(W-PL-6)*t/tot,y=hr=>PT+(H-PT-PB)*(1-(hr-60)/130);
  let t=0,pts=[[x(0),y(75)]];rows.forEach(r=>{const hr=Math.round(72+r.i*26);pts.push([x(t+r.m*.3),y(hr)]);pts.push([x(t+r.m*.82),y(hr)]);t+=r.m});pts.push([x(tot),y(90)]);
  let grid='';[60,100,140,190].forEach(v=>grid+=`<line x1="${PL}" y1="${y(v)}" x2="${W-6}" y2="${y(v)}" stroke="#e2e8f0"/><text x="4" y="${y(v)+4}" font-size="9" fill="#94a3b8">${v}</text>`);
  let marks='';t=0;rows.forEach(r=>{marks+=`<text x="${x(t+r.m/2)}" y="${H-6}" font-size="8" fill="#64748b" text-anchor="middle">${r.p?r.p.slice(0,2):'学练'}</text>`;t+=r.m});
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="background:#fbfdff;border-radius:8px;border:1px solid #e6eef8">${grid}<polyline points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#1f6feb" stroke-width="2.2" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="1.8" fill="#0ea5a5"/>`).join('')}${marks}<text x="${PL}" y="${PT+8}" font-size="9" fill="#94a3b8">心率(次/分)</text></svg>`;
}
let eventKey=location.hash.includes('800')?'800':'400',selected=0;
function renderNav(){document.querySelectorAll('.switch button').forEach(b=>b.classList.toggle('on',b.dataset.event===eventKey));$('#lessonNav').innerHTML=PLANS[eventKey].map((p,i)=>`<button data-i="${i}" class="${i===selected?'on':''}">${i+1}. ${esc(p.name)}</button>`).join('');}
function render(){renderNav();$('#paper').innerHTML=renderPlan(PLANS[eventKey][selected],selected,eventKey);location.hash=eventKey;}
function renderAll(){return PLANS[eventKey].map((p,i)=>renderPlan(p,i,eventKey,true)).join('');}
function today(){const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),2200);}
function exportWord(inner,name){
  const css=`body{font-family:"宋体",SimSun;font-size:10pt;line-height:1.55}table{border-collapse:collapse;width:100%;table-layout:fixed}td,th{border:1px solid #333;padding:4px 5px;vertical-align:top;font-size:9pt}th{background:#eee;text-align:center}.pa-title{text-align:center;font-size:16pt;font-weight:bold;font-family:"黑体",SimHei}.pa-sub{text-align:center;font-size:9pt;color:#555;margin-bottom:8px}.part-cell{text-align:center;font-weight:bold;background:#f5f5f5;width:34px}ul{margin:2px 0;padding-left:16px}.formation{font-family:"Courier New";font-size:8pt;white-space:pre}.tag{font-weight:bold;color:#1f6feb}.loadbox{display:flex;gap:12px}.one-plan{page-break-after:always}.one-plan:last-child{page-break-after:auto}@page{size:A4 portrait;margin:1.5cm 1.2cm}`;
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>${css}</style></head><body>${inner}</body></html>`;
  const blob=new Blob(['﻿'+html],{type:'application/msword;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.doc';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1200);toast('Word已导出，可用WPS或Word继续修改');
}
$('#lessonDate').value=today();
document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>{eventKey=b.dataset.event;selected=0;render()});
$('#lessonNav').onclick=e=>{const b=e.target.closest('button');if(!b)return;selected=+b.dataset.i;render();scrollTo({top:0,behavior:'smooth'})};
$('#regenerate').onclick=()=>{render();toast('教案信息已更新，表格内容可直接修改')};
$('#printOne').onclick=()=>{document.body.classList.remove('print-all');window.print()};
$('#printAll').onclick=()=>{$('#printAllDoc').innerHTML=renderAll();document.body.classList.add('print-all');window.print()};
window.addEventListener('afterprint',()=>{document.body.classList.remove('print-all');$('#printAllDoc').innerHTML=''});
$('#wordOne').onclick=()=>exportWord($('#paper').innerHTML,`七年级${eventKey}米跑第${selected+1}课时教案`);
$('#wordAll').onclick=()=>exportWord(renderAll(),`七年级${eventKey}米跑两周6课时完整教案`);
render();
</script>
</body>
</html>
